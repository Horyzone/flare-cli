[package]
name = "flare-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Simon Micheneau <contact@simon-micheneau.fr>"]
description = "Lightweight, agentless CLI operations and real-time monitoring tool for remote Docker / Dokploy servers"

[[bin]]
name = "flare"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
comfy-table = "7.1"
inquire = "0.7"
reqwest = { version = "0.12", features = ["json"] }
anyhow = "1.0"
thiserror = "2.0"
dirs = "6.0"
chrono = { version = "0.4", features = ["serde"] }
colored = "3.0"
futures = "0.3"
